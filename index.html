<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HidaCity 3D Sensor Map</title>
<meta name="description" content="iPhoneセンサーログを3D地図で可視化するデモ">
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="map"></div>
<div class="hud">
  <div class="brand">HIDACITY MAP <span>3D SENSOR LOG</span></div>
  <div class="panel">
    <h1>3D Sensor Route</h1>
    <p>地図をドラッグして回転、右ドラッグで視点移動、ホイールでズーム。</p>
    <div class="stats">
      <div><span>記録</span><strong id="duration">—</strong></div>
      <div><span>距離</span><strong id="distance">—</strong></div>
      <div><span>高さ</span><strong id="elev">—</strong></div>
      <div><span>平均速度</span><strong id="speed">—</strong></div>
    </div>
  </div>
  <div class="controls">
    <button id="reset">視点リセット</button>
    <button id="toggleBuildings">建物3D</button>
    <button id="toggleRoute">ルート</button>
  </div>
  <div class="privacy">公開版は位置情報を変換・丸めています。元のGPS座標は公開していません。</div>
</div>
<div class="loading" id="loading">3D地図を読み込み中…</div>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
